# 어휘 규칙 (프로토타입). 단독으로는 low — 날짜·문맥과 결합할 때 상향된다.
# 혐오 표현 목록은 두지 않는다. 의미 판단이 필요한 건 LLM 층이 맡는다.
# 오탐을 줄이기 위해 '흔한 일반어'(후보, 최고, 당선 단독 등)는 넣지 않고, 맥락이 있는 표현만 쓴다.
categories:
  military_imagery:
    label: 군사·무기 연상 어휘
    severity: low
    terms: ["탱크", "전차", "폭격", "폭탄", "미사일", "총공세", "저격", "전쟁", "탄약", "포격"]
    note: "'폭탄 세일'·'취향 저격' 같은 관용 표현이 많아 단독으로는 low. 추모일과 결합하면 high."
  election_linked:
    label: 선거·투표 연계 표현
    severity: medium
    terms: ["선거일", "투표소", "총선", "대선", "지방선거", "보궐선거", "선거운동", "당선자", "당선인"]
    note: "선거 연계 혜택·소재는 법무 확인 필요 가능성. '메뉴 투표' 같은 일반 투표는 제외한다."
  superlative_claim:
    label: 최상급·단정 표현 (근거 표기 필요)
    severity: medium
    # 정규식. '최고의 하루' 같은 관용은 잡지 않도록 범위어와 함께 쓰인 경우만 본다.
    patterns:
      - "(국내|업계|세계|세상|대한민국|역대)\\s*(최초|최고|최대|유일|1위)"
      - "(?<![\\d.])1위"
      - "100\\s*%"
      - "유일(한|하게)"
      - "역대급"
      - "가장\\s*(완벽|좋은|맛있는)"
    evidence_markers: ["기준", "조사", "출처", "자체", "집계", "당사 대비"]
    evidence_window: 40
    note: "표시·광고 근거(기준·조사·출처)가 문구 안 가까운 곳에 없으면 법무·표시광고 확인 필요."
  injection_attempt:
    label: 검수 우회 시도 / 지시문 포함
    severity: medium
    patterns:
      - "(이전|위|앞의|모든)\\s*지시.{0,12}무시"
      - "시스템\\s*지시"
      - "(?i)ignore\\s+(all\\s+|the\\s+)?(previous|above)"
      - "(?i)findings"
      - "(안전|문제\\s*없)(하다고|음이?라고|다고)\\s*(만\\s*)?(답|보고|출력)"
    note: "문구 안에 AI에게 내리는 지시처럼 보이는 표현. 검수 대상이 아닌 내용이 섞였거나 우회 시도일 수 있다."
